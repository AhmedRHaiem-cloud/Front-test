<div class="dialog-overlay">
  <div class="dialog-container">
    <div class="dialog-header">
      <h2 class="dialog-title">{{ title }}</h2>
      <button class="close-button" (click)="onClose()" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="dialog-content">
      @if (errorMessage()) {
        <div class="error-message">
          <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="15" y1="9" x2="9" y2="15"></line>
            <line x1="9" y1="9" x2="15" y2="15"></line>
          </svg>
          {{ errorMessage() }}
        </div>
      }

      @if (successMessage()) {
        <div class="success-message">
          <svg class="success-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 12l2 2 4-4"></path>
            <circle cx="12" cy="12" r="10"></circle>
          </svg>
          {{ successMessage() }}
        </div>
      }

      <form (ngSubmit)="onSubmit()" class="product-form">
        <div class="form-group">
          <label for="productName" class="form-label">
            Nom du produit <span class="required">*</span>
          </label>
          <input
            id="productName"
            name="productName"
            type="text"
            class="form-input"
            [(ngModel)]="formData.name"
            [readonly]="isReadOnly"
            placeholder="Entrez le nom du produit"
            maxlength="100"
            required
          />
          <div class="form-hint">Maximum 100 caractères</div>
        </div>

        <div class="form-group">
          <label for="productPrice" class="form-label">
            Prix <span class="required">*</span>
          </label>
          <div class="price-input-container">
            <input
              id="productPrice"
              name="productPrice"
              type="number"
              class="form-input price-input"
              [(ngModel)]="formData.price"
              [readonly]="isReadOnly"
              placeholder="0.00"
              min="0"
              step="0.01"
              required
            />
            <span class="currency-symbol">€</span>
          </div>
          <div class="form-hint">Prix en euros (ex: 29.99)</div>
        </div>

        <div class="form-group">
          <label for="productQuantity" class="form-label">
            Quantité <span class="required">*</span>
          </label>
          <input
            id="productQuantity"
            name="productQuantity"
            type="number"
            class="form-input"
            [(ngModel)]="formData.quantity"
            [readonly]="isReadOnly"
            placeholder="0"
            min="0"
            step="1"
            required
          />
          <div class="form-hint">Quantité en stock</div>
        </div>

        @if (product && (mode === 'view' || mode === 'edit')) {
          <div class="form-group">
            <label class="form-label">ID du produit</label>
            <div class="readonly-field">{{ product.Id }}</div>
          </div>
        }

        <div class="dialog-footer">
          @if (mode === 'view') {
            <button type="button" class="btn btn-secondary" (click)="onClose()">
              Fermer
            </button>
          } @else {
            <button type="button" class="btn btn-secondary" (click)="onClose()" [disabled]="isSubmitting()">
              Annuler
            </button>
            <button 
              type="submit" 
              class="btn btn-primary" 
              [disabled]="!canSubmit"
            >
              @if (isSubmitting()) {
                <div class="loading-spinner-small"></div>
                @if (mode === 'create') {
                  Création...
                } @else {
                  Modification...
                }
              } @else {
                @if (mode === 'create') {
                  Créer le produit
                } @else {
                  Modifier le produit
                }
              }
            </button>
          }
        </div>
      </form>
    </div>
  </div>
</div>
